name: Python and MVP checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            mvp/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r mvp/requirements.txt
          python -m pip check
      - name: Run regression tests
        run: python -m pytest -q --cov=mvp --cov-report=term-missing
      - name: Check front-end JavaScript syntax
        run: |
          node --check mvp/web/app.js
          node --check mvp/web/bulk.js
          node --check mvp/web/draft-store.js
          node --check mvp/web/organisation.js

  browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: python -m pip install -r mvp/requirements.txt
      - name: Install Cypress
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Start isolated local feedback server
        run: |
          FEEDBACK_LOOP_DEMO_MODE=1 FEEDBACK_LOOP_DB_URL=sqlite:///./feedback_loop_cypress.db python -m uvicorn mvp.api:app --host 127.0.0.1 --port 8000 > /tmp/feedback-loop-test.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/auth-mode >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/feedback-loop-test.log
          exit 1
      - name: Run Cypress browser journeys
        run: npm run test:e2e
